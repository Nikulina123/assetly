<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Assetly{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,300&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/assetly.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <svg width="24" height="24" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <rect x="6" y="20" width="4" height="4" rx="2" fill="#00C2A8" opacity=".9"/>
        <rect x="14" y="8" width="4" height="4" rx="2" fill="#F4F7FF"/>
        <rect x="22" y="20" width="4" height="4" rx="2" fill="#00C2A8" opacity=".9"/>
        <line x1="8" y1="20" x2="16" y2="12" stroke="#00C2A8" stroke-width="1.5" stroke-linecap="round" opacity=".7"/>
        <line x1="24" y1="20" x2="16" y2="12" stroke="#00C2A8" stroke-width="1.5" stroke-linecap="round" opacity=".7"/>
        <line x1="10" y1="22" x2="22" y2="22" stroke="#8A9BB5" stroke-width="1.5" stroke-linecap="round" opacity=".35"/>
      </svg>
      <span>asset<span class="ly">ly</span></span>
    </div>

    <a class="nav-item {% if nav_active == 'dashboard' %}active{% endif %}"
       href="/admin/companies/{{ company['id'] }}/dashboard">Dashboard</a>
    <a class="nav-item {% if nav_active == 'computers' %}active{% endif %}"
       href="/admin/companies/{{ company['id'] }}/computers">Computers</a>
    <span class="nav-item disabled" title="Not available yet">Reports</span>
    <span class="nav-item disabled" title="Not available yet">Agents</span>
    <a class="nav-item {% if nav_active == 'settings' %}active{% endif %}"
       href="/admin/companies/{{ company['id'] }}">Settings</a>

    <div style="margin-top:auto"></div>
    <a class="nav-item" href="/admin/companies">← All companies</a>
  </aside>

  <div class="main">
    <header class="topbar">
      <h1>{% block heading %}{{ company['name'] }}{% endblock %}</h1>
      <form method="post" action="/admin/logout">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button type="submit" class="btn btn-secondary">Log out</button>
      </form>
    </header>
    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>
</div>
</body>
</html>
