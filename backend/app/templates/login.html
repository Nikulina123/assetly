<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Assetly</title>
<link rel="stylesheet" href="/static/assetly.css">
</head>
<body>
<div style="display:flex;min-height:100vh;align-items:center;justify-content:center">
  <div style="width:100%;max-width:380px">
    <div class="sidebar-logo" style="justify-content:center;padding-bottom:20px">
      <span style="font-size:22px">asset<span class="ly">ly</span></span>
    </div>
    <div class="display" style="text-align:center;font-size:24px;margin-bottom:26px">
      IT Assets, always in view.
    </div>
    <div class="card">
      {% if error %}
      <div class="banner" style="background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.25);color:#EF4444">{{ error }}</div>
      {% endif %}
      <form method="post" action="/admin/login">
        <label class="label" for="email">Email</label>
        <input class="input" id="email" type="email" name="email" required style="width:100%;margin-bottom:16px">
        <label class="label" for="password">Password</label>
        <input class="input" id="password" type="password" name="password" required style="width:100%;margin-bottom:20px">
        <button type="submit" class="btn" style="width:100%">Log in</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
