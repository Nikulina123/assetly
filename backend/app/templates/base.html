<!DOCTYPE html>
<html>
<head><title>Assetly Admin</title></head>
<body>
<div style="display:flex;">
  <div style="width:220px; padding:16px; border-right:1px solid #ccc;">
    <h3>Assetly Admin</h3>
    <div style="opacity:.6; margin-top:16px;">Companies</div>
    <ul style="list-style:none; padding:0;">
      {% for c in companies %}
      <li><a href="/admin/companies/{{ c['id'] }}">{{ c['name'] }}{% if c['revoked_at'] %} (revoked){% endif %}</a></li>
      {% endfor %}
    </ul>
    <a href="/admin/companies">+ New Company</a>
    <form method="post" action="/admin/logout" style="margin-top:24px;">
      <button type="submit">Logout</button>
    </form>
  </div>
  <div style="flex:1; padding:20px;">
    {% block content %}{% endblock %}
  </div>
</div>
</body>
</html>
