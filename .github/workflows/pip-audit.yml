name: pip-audit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Audits the runtime dependency set only. Dev/test tooling is not
      # deployed, and failing the build on a pytest plugin advisory would
      # train people to ignore this job.
      - run: pip install pip-audit==2.7.3
      - run: pip-audit --requirement requirements.txt --strict
