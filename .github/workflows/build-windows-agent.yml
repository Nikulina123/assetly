name: Build Windows agent and MSI

# AssetlyAgent_Windows.exe is a compiled snapshot of AssetlyAgent_Windows.ps1,
# and the admin portal reads it straight off disk to serve "Download for
# Windows". It therefore has to live in the repository, and has to be rebuilt
# whenever the script changes -- otherwise the portal keeps handing out an agent
# compiled from source that no longer exists.
#
# ps2exe only runs on Windows PowerShell 5.1 on Windows, which is the whole
# reason this is CI rather than something a developer on macOS can do.
on:
  push:
    branches: [main]
    paths:
      - AssetlyAgent_Windows.ps1
      - Build_Windows_EXE.ps1
      - installer/**
      - .github/workflows/build-windows-agent.yml
  # Also on pull requests, so that a change which does not compile is caught
  # in review rather than after merge. Before this, the only way to learn that
  # the agent or the installer no longer builds was to push to main and watch
  # -- which is the wrong moment to find out, because main is what the portal
  # serves from. The commit step below is skipped for pull requests.
  pull_request:
    paths:
      - AssetlyAgent_Windows.ps1
      - Build_Windows_EXE.ps1
      - installer/**
      - .github/workflows/build-windows-agent.yml
  workflow_dispatch:

permissions:
  contents: write

# Two pushes in quick succession would otherwise race to commit different
# builds of the same script.
concurrency:
  group: build-windows-agent
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # `powershell` is Windows PowerShell 5.1; `pwsh` is PowerShell Core, where
      # ps2exe does not work. Do not switch this.
      # Windows PowerShell 5.1 decodes a BOM-less file as Windows-1252 rather
      # than UTF-8. That is not cosmetic: the third byte of a UTF-8 em dash is
      # 0x94, which decodes to a curly right quote under 1252, and PowerShell
      # honours curly quotes as string delimiters -- so a single em dash in a
      # comment or a message silently terminates a string early and the file
      # fails to parse. It cost a red build here, and it is invisible on the
      # macOS and Linux machines these scripts are written on, so it is worth
      # a machine check rather than a convention nobody can see breaking.
      - name: Check PowerShell files are UTF-8 with a BOM
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r f; do
            if [ "$(head -c3 "$f" | xxd -p)" != "efbbbf" ]; then
              echo "::error file=$f::$f has no UTF-8 BOM; Windows PowerShell 5.1 will decode it as Windows-1252."
              bad=1
            fi
          done < <(git ls-files '*.ps1')
          [ "$bad" -eq 0 ] && echo "All .ps1 files carry a UTF-8 BOM."

      - name: Compile the agent with ps2exe
        shell: powershell
        # Deliberately produces an UNSIGNED executable. No code-signing key
        # exists in this workflow and none should be added: signing happens
        # offline in backend/scripts/sign_release.py, and
        # release-consistency.yml proves the signed release was built from the
        # current source by comparing this unsigned output against the
        # manifest's unsigned_sha256. A signing step here would break that
        # check and would hand a repository compromise the power to mint
        # artifacts the fleet installs.
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\Build_Windows_EXE.ps1

      # Built on every change so that a broken .wxs is caught here rather than
      # at release time, but NOT committed: the MSI that ships is built by
      # sign_release.py around the *signed* executable, and an MSI in this
      # repository containing an unsigned one would be an artifact that looks
      # releasable and is not. This one exists to be downloaded from the run
      # page and test-installed on a VM.
      - name: Build the MSI (unsigned, for inspection only)
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\installer\Build_Windows_MSI.ps1 -OutputFile "$env:RUNNER_TEMP\AssetlyAgent.msi"

      # Downloadable from the run page, so a build can be tested on a real
      # Windows machine before anyone trusts the committed copy.
      - name: Upload the build for inspection
        uses: actions/upload-artifact@v4
        with:
          name: AssetlyAgent_Windows
          path: |
            backend/static/AssetlyAgent_Windows.exe
            ${{ runner.temp }}/AssetlyAgent.msi

      # Push and manual runs only. A pull_request run builds from a merge ref
      # that belongs to no branch, so there is nothing it could correctly push
      # to; and a fork's PR has no write token at all.
      - name: Commit the rebuilt executable
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          EXE=backend/static/AssetlyAgent_Windows.exe
          # --porcelain, not `git diff`: on the very first run the executable is
          # untracked, which `git diff` reports as no change at all.
          if [ -z "$(git status --porcelain -- "$EXE")" ]; then
            echo "Executable is byte-identical to the committed one; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$EXE"
          git commit -m "build: recompile AssetlyAgent_Windows.exe from ${GITHUB_SHA:0:7}"
          git push
